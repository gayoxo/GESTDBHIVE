[desktop]
  # Hue ejecuta los *_script con shell: los secretos llegan desde .env via docker-compose
  secret_key_script=printenv HUE_SECRET_KEY
  [[database]]
    engine=postgresql_psycopg2
    host=hue-db
    port=5432
    user=hue
    password_script=printenv HUE_DB_PASSWORD
    name=hue

[beeswax]
  hive_server_host=hiveserver2
  hive_server_port=10000

[metastore]
  enable_new_create_table=true
