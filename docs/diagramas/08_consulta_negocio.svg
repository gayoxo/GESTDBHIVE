<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="762px" preserveAspectRatio="none" style="width:805px;height:762px;background:#FFFFFF;" version="1.1" viewBox="0 0 805 762" width="805px" zoomAndPan="magnify"><title>&#191;Qu&#233; categor&#237;as generan m&#225;s ingresos en cada estado y mes?</title><defs/><g><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="772.3418" x="15" y="35.4209">&#191;Qu&#233; categor&#237;as generan m&#225;s ingresos en cada estado y mes?</text><!--entity f--><g id="elem_f"><rect fill="#FFF3C4" height="85.1875" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="208.5078" x="227.4724" y="58.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="178.6436" x="237.4724" y="81.6045">1. FROM gold.fact_ventas</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="173.9404" x="237.4724" y="97.9014">(grano: art&#237;culo vendido)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="142.4063" x="237.4724" y="114.1982">WHERE anio = 2018</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="188.5078" x="237.4724" y="130.4951">&#8594; solo particiones de 2018</text></g><!--entity c--><g id="elem_c"><rect fill="#FFFFFF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="235.6055" x="213.9724" y="203.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="167.166" x="223.9724" y="226.6045">2. JOIN gold.dim_cliente</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="111.6445" x="223.9724" y="242.9014">ON customer_id</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="215.6055" x="223.9724" y="259.1982">&#8594; estado del cliente (MariaDB)</text></g><!--entity p--><g id="elem_p"><rect fill="#FFFFFF" height="68.8906" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="213.6826" x="224.9724" y="332.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="182.8203" x="234.9724" y="355.6045">3. JOIN gold.dim_producto</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="99.873" x="234.9724" y="371.9014">ON product_id</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="193.6826" x="234.9724" y="388.1982">&#8594; categor&#237;a en ingl&#233;s (CSV)</text></g><!--entity g--><g id="elem_g"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="314.9912" x="174.4724" y="461.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="294.7861" x="184.4724" y="484.6045">4. GROUP BY estado, categor&#237;a, anio, mes</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="294.9912" x="184.4724" y="500.9014">COUNT(*) art&#237;culos &#183; SUM(precio) ingresos</text></g><!--entity o--><g id="elem_o"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="216.875" x="223.4724" y="574.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="196.875" x="233.4724" y="597.6045">5. ORDER BY ingresos DESC</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="58.9531" x="233.4724" y="613.9014">LIMIT 20</text></g><!--entity r--><g id="elem_r"><rect fill="#DDFFDD" height="68.8906" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.0;" width="222.5693" x="220.4724" y="687.6094"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="69.918" x="230.4724" y="710.6045">Resultado</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="202.5693" x="230.4724" y="726.9014">SP &#183; health_beauty &#183; 2018-08</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="175.8066" x="230.4724" y="743.1982">409 art&#237;culos &#183; 49.676,60</text></g><g id="elem_GMN13"><path d="M471.9724,81.1094 L471.9724,97.6094 L436.5724,101.6094 L471.9724,105.6094 L471.9724,121.375 A0,0 0 0 0 471.9724,121.375 L641.8694,121.375 A0,0 0 0 0 641.8694,121.375 L641.8694,91.1094 L631.8694,81.1094 L471.9724,81.1094 A0,0 0 0 0 471.9724,81.1094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><path d="M631.8694,81.1094 L631.8694,91.1094 L641.8694,91.1094 L631.8694,81.1094 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.0;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="148.897" x="477.9724" y="98.1763">Los pedidos y art&#237;culos</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="143.2793" x="477.9724" y="113.3091">vienen de PostgreSQL</text></g><!--link f to c--><g id="link_f_c"><path d="M331.9724,143.7094 C331.9724,162.8694 331.9724,179.2094 331.9724,197.3494 " fill="none" id="f-to-c" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="331.9724,203.3494,335.9724,194.3494,331.9724,198.3494,327.9724,194.3494,331.9724,203.3494" style="stroke:#000000;stroke-width:1.0;"/></g><!--link c to p--><g id="link_c_p"><path d="M331.9724,272.6794 C331.9724,291.1894 331.9724,307.9194 331.9724,326.4394 " fill="none" id="c-to-p" style="stroke:#000000;stroke-width:1.0;"/><polygon fill="#000000" points="331.9724,332.4394,335.9724,323.4394,331.9724,327.4394,327.9724,323.4394,331.9724,332.4394" style="stroke:#000000;stroke-width:1.0;"/></g><!--link p to g--><g id="link_p_g"><path d="M331.9724,401.7794 C331